version: '3.7'
services:
  nginx:
    image: nginx:stable
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - '${PUBLISH_PORT:-8000}:80'
    depends_on:
      - backend
      - frontend

  postgres:
    image: postgres:12
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - db-data:/var/lib/postgresql/data:cached

  backend:
    image: "backend:${VERSION:-latest}"
    build:
      context: backend
      dockerfile: Dockerfile
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    command:
      - /bin/bash
      - -c
      - |
        set -e
        wait-for-it -t 0 ${DB_HOST:-postgres}:${DB_PORT:-5432}
        alembic upgrade head
        python app/main.py
    tty: true
    volumes:
      - ./backend:/app/:cached
      - ./.docker/.ipython:/root/.ipython:cached
    environment:
      PYTHONPATH: .
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@taxman.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-password}
      DB_HOST: ${DB_HOST:-postgres}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-postgres}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      DATABASE_URL: 'postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-password}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-postgres}'
      API_KEY_CHECKLIST: ${API_KEY_CHECKLIST:-password}
      IMPORT_API_KEY_WACENSUS:  ${IMPORT_API_KEY_WACENSUS:-password}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      WACENSUS_DATA_FILE_URL: ${WACENSUS_DATA_FILE_URL:-https://example.org/datafile.zip}
      WACENSUS_SUFFIX: ${WACENSUS_SUFFIX:-.csv}
    depends_on:
      - "postgres"

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        NPM_TOKEN: ${NPM_TOKEN}
    stdin_open: true
    volumes:
      - './frontend:/app:cached'
      - './frontend/node_modules:/app/node_modules:cached'
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - REACT_APP_BASE_URL=${REACT_APP_BASE_URL:-http://localhost:8000}
      - REACT_APP_BACKEND_URL=${REACT_APP_BACKEND_URL:-http://localhost:8000/api/v1}

volumes:
  db-data:
