[tool.poetry]
name = "Nomos"
version = "1.1.2"
description = "Nomos - Taxonomic Names Management Tool"
authors = [
    "Bri Williams <bri.williams@gaiaresources.com.au>",
    "Danny Murphy <danny.murphy@dbca.wa.gov.au>",
    "Gordon Campbell <gordon.campbell@dbca.wa.gov.au>",
    "Jithendralal Nair <jithendralal.nair@gaiaresources.com.au>",
    "Kehan Harman <kehan.harman@gaiaresources.com.au>",
    "Nick Crawford <nick.crawford@gaiaresources.com.au>",
    "Nikolai Panine <Nikolai.Panine@dbca.wa.gov.au>",
    "Phil Long <phil.long@gaiaresources.com.au>"
]
packages = [
    { include = "app" },
]

[tool.poetry.dependencies]
python = "^3.9"
alembic = "^1.11.1"
Authlib = "^1.2.1"
fastapi = "^0.98.0"
fastapi-key-auth = "^0.12.0"
httpx = "^0.24.1"
ipython = "^8.14.0"
itsdangerous = "^2.1.2"
Jinja2 = "^3.1.2"
loguru = "^0.7.0"
psycopg2 = "^2.9.6"
pytest = "^7.4.0"
requests = "^2.31.0"
SQLAlchemy = "^1.4.49"
uvicorn = "^0.22.0"
passlib = "^1.7.4"
pandas = "^2.0.1"
openpyxl = "^3.1.2"
bcrypt = "^4.0.1"
sqlalchemy-utils = "^0.41.1"
sqlalchemy_mixins = "^1.5.3"
python-dateutil = "^2.8.2"
python-multipart = "^0.0.6"
pyjwt = "^2.8.0"
mypy = "^1.4.1"
autoflake = "^2.1.1"
flake8 = "^6.0.0"
black = "^23.3.0"
colorama = "^0.4.6"
isort = "^5.12.0"

[tool.black]
preview = 1

[tool.isort]
profile = "black"
src_paths = ["app"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
