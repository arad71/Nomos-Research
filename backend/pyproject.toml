[tool.poetry]
name = "Nomos"
version = "2.0.5"
description = "Nomos - Taxonomic Names Management Tool"
authors = [
    "Bri Williams <bri.williams@gaiaresources.com.au>",
    "Danny Murphy <danny.murphy@dbca.wa.gov.au>",
    "Gordon Campbell <gordon.campbell@dbca.wa.gov.au>",
    "Jithendralal Nair <jithendralal.nair@gaiaresources.com.au>",
    "Kehan Harman <kehan.harman@gaiaresources.com.au>",
    "Nick Crawford <nick.crawford@gaiaresources.com.au>",
    "Nikolai Panine <Nikolai.Panine@dbca.wa.gov.au>",
    "Phil Long <phil.long@gaiaresources.com.au>",
    "Zahurul Huq <zahurul.huq@dbca.wa.gov.au>"
]
packages = [
    { include = "app" },
]

[tool.poetry.dependencies]
python = "^3.9"
alembic = "^1.13.1"
Authlib = "^1.6.0"
fastapi = "^0.110.1"
fastapi-key-auth = "^0.12.0"
httpx = "^0.28.1"
ipython = "^8.18.1"
itsdangerous = "^2.1.2"
Jinja2 = "^3.1.6"
loguru = "^0.7.2"
psycopg2 = "^2.9.9"
pytest = "^8.0.0"
requests = "^2.32.4"
SQLAlchemy = "<2.0"
uvicorn = "^0.24.0"
passlib = "^1.7.4"
pandas = "^2.2.1"
openpyxl = "^3.1.2"
bcrypt = "^4.1.2"
sqlalchemy-utils = "^0.41.1"
sqlalchemy_mixins = "^1.5.3"
python-dateutil = "^2.8.2"
python-multipart = "^0.0.18"
pyjwt = "^2.8.0"
mypy = "^1.8.0"
autoflake = "^2.2.1"
flake8 = "^7.0.0"
black = "^23.11.0"
colorama = "^0.4.6"
isort = "^5.13.2"
typer = {extras = ["all"], version = "^0.12.3"}
rich = "^13.7.0"
deepdiff = "^8.5.0"

[tool.black]
preview = 1

[tool.isort]
profile = "black"
src_paths = ["app"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
