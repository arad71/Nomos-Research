[tool.poetry]
name = "Nomos"
version = "2.0.7"
description = "Nomos - Taxonomic Names Management Tool"
authors = [
    "Bri Williams <bri.williams@gaiaresources.com.au>",
    "Danny Murphy <danny.murphy@dbca.wa.gov.au>",
    "Gordon Campbell <gordon.campbell@dbca.wa.gov.au>",
    "Jithendralal Nair <jithendralal.nair@gaiaresources.com.au>",
    "Kehan Harman <kehan.harman@gaiaresources.com.au>",
    "Nick Crawford <nick.crawford@gaiaresources.com.au>",
    "Nikolai Panine <Nikolai.Panine@dbca.wa.gov.au>",
    "Phil Long <phil.long@gaiaresources.com.au>",
    "Zahurul Huq <zahurul.huq@dbca.wa.gov.au>"
]
packages = [
    { include = "app" },
]

[tool.poetry.dependencies]
python = "^3.12"
alembic = "^1.16.5"
Authlib = "^1.7.1"
fastapi =  "^0.136.1"
fastapi-key-auth = "^0.15.5"
httpx = "^0.28.1"
ipython = "^9.13.0"
itsdangerous = "^2.1.2"
Jinja2 = "^3.1.6"
loguru = "^0.7.3"
psycopg2-binary = "^2.9.12"
pytest = "^9.0.3"
requests = "^2.33.0"
SQLAlchemy = "<2.0"
uvicorn = "^0.46.0"
passlib = ">=1.7.4"
pandas = "^3.0.3"
openpyxl = "^3.1.2"
bcrypt = "4.0.1"
sqlalchemy-utils = "^0.42.1"
sqlalchemy_mixins = "^1.5.3"
python-dateutil = "^2.8.2"
python-multipart = "^0.0.27"
pyjwt = "^2.12.1"
mypy = "^1.20.2"
autoflake = "^2.2.1"
flake8 = "^7.0.0"
black = "^26.3.1"
colorama = "^0.4.6"
isort = "^8.0.1"
typer = {extras = ["all"], version = "^0.25.1"}
rich = "^15.0.0"
deepdiff = "^9.0.0"
pydantic-settings = "^2.14.0"


[tool.black]
preview = 1
target-version = ["py311"]
extend-exclude = "backend/app/alembic/"

[tool.isort]
profile = "black"
src_paths = ["app"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
select = ["E", "F", "W", "UP", "Pydantic"]
ignore = []
exclude = [
    "backend/app/alembic/**",
]


[tool.ruff.pydantic]
# fail on deprecated v1 Config
ban-class-config = true
# fail on @validator / @root_validator
ban-deprecated-validators = true
