server {
    listen 80;
    server_name taxman;

    location / {
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header x-email admin@taxman.com;
        proxy_set_header x-first-name FirstName;
        proxy_set_header x-last-name LastName;
        proxy_set_header x-full-name 'FirstName LastName';
        proxy_set_header x-groups ADMIN;
        proxy_set_header x-shared-id foo;
        proxy_set_header x-logout-url /sso/auth_logout;

        proxy_pass http://frontend:3000;

        proxy_redirect off;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api {
# Unprivileged user
#         proxy_set_header x-email unprivileged@user.com;
#         proxy_set_header x-first-name Unprivileged;
#         proxy_set_header x-last-name User;
#         proxy_set_header x-full-name 'Unprivileged User';
#         proxy_set_header x-groups '';
#  Reader user
#         proxy_set_header x-email READER@example.com;
#         proxy_set_header x-first-name READER;
#         proxy_set_header x-last-name 'Demo User';
#         proxy_set_header x-full-name 'READER Demo User';
#         proxy_set_header x-groups 'READER';
#  Superuser
        proxy_set_header x-email admin@taxman.com;
        proxy_set_header x-first-name FirstName;
        proxy_set_header x-last-name LastName;
        proxy_set_header x-full-name 'FirstName LastName';
        proxy_set_header x-groups ADMIN;
        proxy_set_header x-shared-id foo;
        proxy_set_header x-logout-url /sso/auth_logout;
        proxy_pass http://backend:8888/api;
    }
}
