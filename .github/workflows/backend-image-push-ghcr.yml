name: Build and push backend into ghcr

on:
  push:
    branches: [ staging ]
  pull_request:
    branches: [ staging ]

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  ORG: bio-wa
  IMAGE_NAME: nomos-backend-api

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Build the Docker image
      run: docker build . --file backend/Dockerfile --tag ${{ env.REGISTRY }}/${{ env.ORG }}/${{env.IMAGE_NAME}}
      
    - name: Log in to the Container registry
      uses: docker/login-action@v1
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Push the fastapi image 
      run: docker push ${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.IMAGE_NAME }}
    
