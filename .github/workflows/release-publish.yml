name: Release Publish 
on:
  release:
    types: [published]
  workflow_dispatch:
  
env:
  REGISTRY: ghcr.io
  ORG: bio-wa
  FRONTEND_DOCKER_PATH: ./frontend/Dockerfile
  BACKEND_DOCKER_PATH: ./backend/Dockerfile
  BACKEND_IMAGE_NAME: nomos-backend-api
  FRONTEND_IMAGE_NAME: nomos-frontend
  
jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Extract backend metadata (tags, labels) for Docker 
      id: meta_backend
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.BACKEND_IMAGE_NAME }}

    - name: Build and push backend Docker image
      uses: docker/build-push-action@v6
      with:
        context: ./backend
        file: ${{ env.BACKEND_DOCKER_PATH }}
        push: true
        tags: ${{ steps.meta_backend.outputs.tags }}
        labels: ${{ steps.meta_backend.outputs.labels }}
        cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.BACKEND_IMAGE_NAME }}:cache
        cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.BACKEND_IMAGE_NAME }}:cache,mode=max

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Extract frontend metadata (tags, labels) for Docker 
      id: meta_frontend
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.FRONTEND_IMAGE_NAME }}

    - name: Build and push frontend Docker image
      uses: docker/build-push-action@v6
      with:
        context: ./frontend
        file: ${{ env.FRONTEND_DOCKER_PATH }}
        push: true
        tags: ${{ steps.meta_frontend.outputs.tags }}
        labels: ${{ steps.meta_frontend.outputs.labels }}
        secrets: |
          npm_token=${{ secrets.NPM_TOKEN }}
        cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.FRONTEND_IMAGE_NAME }}:cache
        cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.FRONTEND_IMAGE_NAME }}:cache,mode=max
        