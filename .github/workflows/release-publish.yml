name: Release Publish 

on:
  release:
    types: [published]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  
env:
  REGISTRY: ghcr.io
  ORG: bio-wa
  FRONTEND_DOCKER_PATH: ./frontend/Dockerfile
  BACKEND_DOCKER_PATH: ./backend/Dockerfile
  BACKEND_IMAGE_NAME: nomos-backend-api
  FRONTEND_IMAGE_NAME: nomos-frontend
  
jobs:

  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract frontend metadata (tags, labels) for Docker 
      id: meta_frontend
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.FRONTEND_IMAGE_NAME }}

    - name: Extract Backend metadata (tags, labels) for Docker 
      id: meta_backend
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.BACKEND_IMAGE_NAME }}

    - name: Build and push backend Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ${{ env.BACKEND_DOCKER_PATH}}
        push: true
        tags: ${{ steps.meta_backend.outputs.tags }}
        labels: ${{ steps.meta_backend.outputs.labels }}

    - name: Build and push frontend Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ${{ env.FRONTEND_DOCKER_PATH}}
        push: true
        # secrets: |
        #      "NPM_TOKEN=${{ secrets.NPM_TOKEN }}"
        tags: ${{ steps.meta_frontend.outputs.tags }}
        labels: ${{ steps.meta_frontend.outputs.labels }}

        # # This is the critical part: pass the secret to BuildKit
        # secrets: |
        #     id=NPM_TOKEN,env=NPM_TOKEN
        # # Helpful for debugging the secret mount/npm output
        # provenance: false
        # sbom: false
        # env:
        #   # Define your repo/org secret named NPM_TOKEN in GitHub settings
        #   NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        
