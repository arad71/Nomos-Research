# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Continuous Integration / Continuous Delivery

on:
  - push
  - pull_request

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: Set up Python 3.10
        uses: actions/setup-python@v2
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Lint backend code
        run: |
          cd backend
          # copy of scripts/lint.sh
          # Check whitespace for better diffs
          black --diff --check --color app
          # Sort imports
          isort --diff --check --color .
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings.
          flake8 . --count --exit-zero --max-complexity=10 --statistics

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v1
      - name: Build the docker-compose stack
        run: scripts/build.sh
      - name: Run test suite
        run: scripts/test.sh
      - name: Print logs
        if: always()
        run: docker-compose logs

  deploy:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Only run deployment if preceding pipelines were successful
    #    needs:
    #      - lint
    #      - test
    if:
      contains('
      refs/heads/deployTweaks
      refs/heads/staging
      refs/heads/production
      ', github.ref)

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Deploy Stack
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_SECRET }}
          port: ${{ secrets.SSH_PORT}}
          script: |
            set -x
            set -e
            set -u
            cd /home/azureuser/bdr/BDRTaxMan
            git checkout staging
            git pull
            # ignore docker-compose.override.yml using env variable
            COMPOSE_FILE=docker-compose.yml scripts/build.sh
      - name: Check http status code of deployed site
        uses: jtalk/url-health-check-action@v2
        with:
          # Check the following URLs one by one sequentially
          url: "http://${{ secrets.SSH_HOST }}|http://${{ secrets.SSH_HOST }}/api"
          # Follow redirects, or just report success on 3xx status codes
          follow-redirect: true
          max-attempts: 5
          retry-delay: 5s
