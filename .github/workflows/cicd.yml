# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Continuous Integration / Continuous Delivery

on:
  - push

jobs:
  lint-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Get user and group id
        run: |
          echo "uid=$(id -u), gid=$(id -g)"
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          python -m pip install poetry
          poetry config virtualenvs.create false
          poetry install --no-dev
      - name: Lint backend code
        run: |
          cd backend
          # copy of scripts/lint.sh
          # Check whitespace for better diffs
          black --diff --check --color app
          # Sort imports
          isort --diff --check --color .
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings.
          flake8 . --count --exit-zero --max-complexity=10 --statistics

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: npm-

      - name: Copy in .npmrc
        run: cp frontend/.npmrc.docker ~/.npmrc

      - name: Install dependencies
        env:
          NPM_TOKEN: "${{ secrets.NPM_TOKEN }}"
        run: npm --prefix=frontend ci --ignore-scripts

      - name: Build app to run linting
        env:
          NPM_TOKEN: "${{ secrets.NPM_TOKEN }}"
        run: npm --prefix=frontend run build

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v1
      - name: Build the docker compose stack
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: USER_ID=$(id -u) GROUP_ID=$(id -g) scripts/build.sh
      - name: Run test suite
        run: scripts/test.sh
      - name: Run downgrade migrations
        run: scripts/downgrade.sh
      - name: Print logs
        if: always()
        run: docker compose logs
