# Blank automation template for data delivery repo (scaffolding) 
# This template will execute on push or pull requests, the script will run tests once the test are created for the project

name: Staging Deployment

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the develop branch
  push:
    branches: [ staging, deployTweaks ]
  pull_request:
    branches: [ staging, deployTweaks ]
#  Only when the other pipelines have completed
#  https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#workflow_run
  workflow_run:
    types:
      - completed
    workflows:
      - Lint packages
      - Run backend / frontend tests

      # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  deploy:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Only run deployment if preceding pipelines were successful
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Copy in deployment script
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_SECRET }}
          port: ${{ secrets.SSH_PORT }}
          source: ".github/action.bash"
          target: "/home/azureuser/bdr/action.bash"

      - name: Deploy Stack
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_SECRET }}
          port: ${{ secrets.SSH_PORT}}
          script: |
            /home/azureuser/bdr/action.bash
