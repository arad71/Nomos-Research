name: Docker Image CI

on: [push]

jobs:

  build:

    runs-on: ubuntu-latest
    env:
       PORT: 8000

    steps:
      - uses: actions/checkout@v1
      - name: Build the docker-compose stack
        run: scripts/build.sh
      - name: Run test suite
        run: scripts/test.sh
      - name: Print logs
        if: always()
        run: docker-compose logs